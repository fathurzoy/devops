services:
  frontend-fe1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: frontend
    image: example-frontend:latest
    container_name: example-fe1
    restart: unless-stopped
    environment:
      SERVICE_NAME: frontend-fe1
      FE_ID: fe1
      PORT: "8080"
    ports:
      - "3200:8080"
    mem_limit: 96m
    networks:
      - example-net

  frontend-fe2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: frontend
    image: example-frontend:latest
    container_name: example-fe2
    restart: unless-stopped
    environment:
      SERVICE_NAME: frontend-fe2
      FE_ID: fe2
      PORT: "8080"
    ports:
      - "3201:8080"
    mem_limit: 96m
    networks:
      - example-net

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: gateway
    image: example-gateway:latest
    container_name: example-gateway
    restart: unless-stopped
    environment:
      SERVICE_NAME: api-gateway
      USER_SERVICE_URL: http://example-user-service:8080
      ORDER_SERVICE_URL: http://example-order-service:8080
      NOTIFICATION_SERVICE_URL: http://example-notification-service:8080
      PORT: "8080"
    ports:
      - "18080:8080"
    mem_limit: 128m
    networks:
      - example-net
      - platform-net

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: userservice
    image: example-user-service:latest
    container_name: example-user-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: user-service
      DATABASE_URL: postgres://example:${POSTGRES_PASSWORD}@example-postgres:5432/exampledb?sslmode=disable
      REDIS_ADDR: example-redis:6379
      PORT: "8080"
    depends_on:
      - postgres
      - redis
    mem_limit: 128m
    networks:
      - example-net
      - platform-net

  order-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: orderservice
    image: example-order-service:latest
    container_name: example-order-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: order-service
      DATABASE_URL: postgres://example:${POSTGRES_PASSWORD}@example-postgres:5432/exampledb?sslmode=disable
      USER_SERVICE_URL: http://example-user-service:8080
      RABBITMQ_URL: amqp://example:${RABBITMQ_PASSWORD}@example-rabbitmq:5672/
      PORT: "8080"
    depends_on:
      - postgres
      - rabbitmq
    mem_limit: 128m
    networks:
      - example-net
      - platform-net

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: notification
    image: example-notification-service:latest
    container_name: example-notification-service
    restart: unless-stopped
    environment:
      SERVICE_NAME: notification-service
      RABBITMQ_URL: amqp://example:${RABBITMQ_PASSWORD}@example-rabbitmq:5672/
      PORT: "8080"
    depends_on:
      - rabbitmq
    mem_limit: 128m
    networks:
      - example-net
      - platform-net

  postgres:
    image: postgres:16-alpine
    container_name: example-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: example
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: exampledb
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - example_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d exampledb"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    networks:
      - example-net

  redis:
    image: redis:7-alpine
    container_name: example-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    mem_limit: 96m
    networks:
      - example-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: example-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: example
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:15672:5672"
      - "15673:15672"
    volumes:
      - example_mqdata:/var/lib/rabbitmq
    mem_limit: 384m
    networks:
      - example-net

volumes:
  example_pgdata:
  example_mqdata:

networks:
  example-net:
    driver: bridge
  platform-net:
    external: true
    name: devops-platform_platform-net
