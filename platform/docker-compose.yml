services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: platform-portainer
    restart: unless-stopped
    command: -H unix:///var/run/docker.sock
    ports:
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    mem_limit: 256m
    networks:
      - platform-net

  prometheus:
    image: prom/prometheus:latest
    container_name: platform-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    mem_limit: 384m
    networks:
      - platform-net

  grafana:
    image: grafana/grafana:latest
    container_name: platform-grafana
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
    mem_limit: 384m
    networks:
      - platform-net

  loki:
    image: grafana/loki:latest
    container_name: platform-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    mem_limit: 384m
    networks:
      - platform-net

  promtail:
    image: grafana/promtail:latest
    container_name: platform-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail_data:/tmp
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    mem_limit: 128m
    networks:
      - platform-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: platform-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
    mem_limit: 128m
    networks:
      - platform-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: platform-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --disable_metrics=disk,diskIO,percpu,process,sched,tcp,udp,cpu_topology,perf_event,referenced_memory,hugetlb,resctrl,cpuset,memory_numa,advtcp
      - --housekeeping_interval=30s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 384m
    networks:
      - platform-net

volumes:
  portainer_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_data:

networks:
  platform-net:
    driver: bridge
